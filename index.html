<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BudgetZen – Legal Documents</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 32px;
            padding: 40px 32px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(2px);
        }
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo h1 {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #6366F1, #8B5CF6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo p {
            color: #5b6e8c;
            font-size: 1.1rem;
            margin-top: 8px;
        }
        .notice {
            background: #FEF9E3;
            border-left: 6px solid #F59E0B;
            border-radius: 20px;
            padding: 20px 24px;
            margin-bottom: 40px;
        }
        .notice h3 {
            color: #B45309;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .notice p {
            color: #92400E;
            font-size: 0.95rem;
        }
        .language-selector {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 48px;
        }
        .lang-btn {
            background: #F1F5F9;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .lang-btn:hover {
            background: #E2E8F0;
            transform: translateY(-1px);
        }
        .lang-btn.active {
            background: #6366F1;
            color: white;
            box-shadow: 0 4px 10px rgba(99,102,241,0.3);
        }
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin: 20px 0;
        }
        .document-card {
            background: white;
            border-radius: 28px;
            padding: 32px 24px;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.3s;
            border: 1px solid #E9EEF3;
            box-shadow: 0 8px 20px rgba(0,0,0,0.02);
        }
        .document-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.15);
            border-color: #CBD5E1;
        }
        .doc-icon {
            font-size: 3.5rem;
            margin-bottom: 20px;
        }
        .document-card h2 {
            font-size: 1.7rem;
            font-weight: 700;
            color: #0F172A;
            margin-bottom: 12px;
        }
        .document-card p {
            color: #475569;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            background: #6366F1;
            color: white;
            padding: 12px 32px;
            border-radius: 40px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #4F46E5;
        }
        .footer {
            margin-top: 48px;
            text-align: center;
            padding-top: 24px;
            border-top: 1px solid #E9EEF3;
            color: #6C7A91;
            font-size: 0.85rem;
        }
        @media (max-width: 700px) {
            .container { padding: 24px 20px; }
            .logo h1 { font-size: 2rem; }
            .document-card h2 { font-size: 1.4rem; }
            .lang-btn { padding: 6px 14px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">
        <h1>💰 BudgetZen</h1>
        <p>Legal documents – Privacy & Terms</p>
    </div>
    <div class="notice">
        <h3>📱 100% local mobile app</h3>
        <p>All data stays on your device • No account required • Premium features managed by Google Play</p>
    </div>
    <div class="language-selector" id="langSelector">
        <button class="lang-btn" data-lang="en">🇬🇧 English</button>
        <button class="lang-btn" data-lang="fr">🇫🇷 Français</button>
        <button class="lang-btn" data-lang="de">🇩🇪 Deutsch</button>
        <button class="lang-btn" data-lang="es">🇪🇸 Español</button>
        <button class="lang-btn" data-lang="it">🇮🇹 Italiano</button>
        <button class="lang-btn" data-lang="pt">🇵🇹 Português</button>
        <button class="lang-btn" data-lang="ja">🇯🇵 日本語</button>
        <button class="lang-btn" data-lang="ar">🇸🇦 العربية</button>
        <button class="lang-btn" data-lang="ko">🇰🇷 한국어</button>
        <button class="lang-btn" data-lang="tr">🇹🇷 Türkçe</button>
    </div>
    <div class="grid-2" id="docsContainer"></div>
    <div class="footer">
        <p>© 2025 BudgetZen • Contact: <a href="mailto:sadek.jebly@gmail.com" style="color:#6366F1;">sadek.jebly@gmail.com</a></p>
        <p style="margin-top: 8px; font-size:0.8rem;">Official legal documents for BudgetZen mobile app</p>
    </div>
</div>
<script>
    const translations = {
        en: { title: "Privacy Policy", desc: "How BudgetZen protects your privacy and handles data", btn: "Read Privacy Policy", termsTitle: "Terms of Service", termsDesc: "Terms and conditions for using BudgetZen", termsBtn: "Read Terms" },
        fr: { title: "Politique de confidentialité", desc: "Comment BudgetZen protège votre vie privée", btn: "Lire la politique", termsTitle: "Conditions d'utilisation", termsDesc: "Conditions générales d'utilisation", termsBtn: "Lire les conditions" },
        de: { title: "Datenschutzerklärung", desc: "Wie BudgetZen Ihre Privatsphäre schützt", btn: "Datenschutz lesen", termsTitle: "Nutzungsbedingungen", termsDesc: "Bedingungen für die Nutzung", termsBtn: "Bedingungen lesen" },
        es: { title: "Política de privacidad", desc: "Cómo BudgetZen protege tu privacidad", btn: "Leer política", termsTitle: "Términos de servicio", termsDesc: "Términos y condiciones", termsBtn: "Leer términos" },
        it: { title: "Informativa sulla privacy", desc: "Come BudgetZen protegge la tua privacy", btn: "Leggi la privacy", termsTitle: "Termini di servizio", termsDesc: "Termini e condizioni", termsBtn: "Leggi i termini" },
        pt: { title: "Política de Privacidade", desc: "Como o BudgetZen protege sua privacidade", btn: "Ler política", termsTitle: "Termos de serviço", termsDesc: "Termos e condições", termsBtn: "Ler termos" },
        ja: { title: "プライバシーポリシー", desc: "BudgetZenがどのようにプライバシーを保護するか", btn: "プライバシーポリシーを読む", termsTitle: "利用規約", termsDesc: "BudgetZenの利用条件", termsBtn: "利用規約を読む" },
        ar: { title: "سياسة الخصوصية", desc: "كيف تحمي BudgetZen خصوصيتك", btn: "اقرأ سياسة الخصوصية", termsTitle: "شروط الخدمة", termsDesc: "شروط وأحكام الاستخدام", termsBtn: "اقرأ الشروط" },
        ko: { title: "개인정보처리방침", desc: "BudgetZen이 개인정보를 보호하는 방법", btn: "개인정보처리방침 읽기", termsTitle: "이용약관", termsDesc: "BudgetZen 이용 약관", termsBtn: "이용약관 읽기" },
        tr: { title: "Gizlilik Politikası", desc: "BudgetZen'in gizliliğinizi nasıl koruduğu", btn: "Gizlilik politikasını oku", termsTitle: "Hizmet Şartları", termsDesc: "BudgetZen uygulama koşulları", termsBtn: "Şartları oku" }
    };
    function setLanguage(lang) {
        const t = translations[lang] || translations.en;
        document.getElementById('docsContainer').innerHTML = `
            <div class="document-card">
                <div class="doc-icon">🔒</div>
                <h2>${t.title}</h2>
                <p>${t.desc}</p>
                <a href="privacy.html?lang=${lang}" class="btn">${t.btn}</a>
            </div>
            <div class="document-card">
                <div class="doc-icon">📄</div>
                <h2>${t.termsTitle}</h2>
                <p>${t.termsDesc}</p>
                <a href="terms.html?lang=${lang}" class="btn">${t.termsBtn}</a>
            </div>
        `;
        document.querySelectorAll('.lang-btn').forEach(btn => {
            if (btn.dataset.lang === lang) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        localStorage.setItem('budgetzen_legal_lang', lang);
        const url = new URL(window.location);
        url.searchParams.set('lang', lang);
        window.history.replaceState({}, '', url);
    }
    document.addEventListener('DOMContentLoaded', () => {
        let lang = new URLSearchParams(window.location.search).get('lang');
        if (!lang || !translations[lang]) lang = localStorage.getItem('budgetzen_legal_lang') || 'en';
        if (!translations[lang]) lang = 'en';
        setLanguage(lang);
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
        });
    });
</script>
</body>
</html>
